<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>代码审查 Agent</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f6f8;
      color: #222;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      font-size: 15px;
      line-height: 1.6;
    }

    main {
      width: min(860px, calc(100% - 32px));
      margin: 40px auto;
    }

    header {
      margin-bottom: 22px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 28px;
      font-weight: 600;
    }

    header p {
      margin: 0;
      color: #666;
    }

    section {
      margin-bottom: 18px;
      padding: 22px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fff;
    }

    h2 {
      margin: 0 0 14px;
      font-size: 18px;
      font-weight: 600;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #555;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 150px;
      padding: 12px;
      resize: vertical;
      border: 1px solid #bbb;
      border-radius: 5px;
      background: #fff;
      color: #222;
      font: inherit;
    }

    textarea:focus {
      border-color: #2563eb;
      outline: 2px solid rgba(37, 99, 235, .12);
    }

    .hint {
      margin: 7px 0 14px;
      color: #777;
      font-size: 13px;
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    button {
      padding: 8px 15px;
      border: 1px solid #2563eb;
      border-radius: 5px;
      background: #2563eb;
      color: #fff;
      font: inherit;
      cursor: pointer;
    }

    button.secondary {
      border-color: #bbb;
      background: #fff;
      color: #333;
    }

    button:hover:not(:disabled) {
      opacity: .88;
    }

    button:disabled {
      cursor: wait;
      opacity: .55;
    }

    .result-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    .result-heading h2 {
      margin: 0;
    }

    #run-state {
      color: #666;
      font-size: 13px;
    }

    #tool-steps {
      margin-bottom: 10px;
      color: #666;
      font-size: 13px;
    }

    .tool-chip:not(:last-child)::after {
      content: " → ";
      color: #999;
    }

    pre {
      min-height: 250px;
      margin: 0;
      padding: 14px;
      overflow: auto;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      border: 1px solid #ddd;
      border-radius: 5px;
      background: #fafafa;
      color: #222;
      font: 14px/1.7 Consolas, "Microsoft YaHei", monospace;
    }

    .error {
      color: #b42318;
    }

    footer {
      color: #888;
      font-size: 13px;
      text-align: center;
    }

    @media (max-width: 600px) {
      main {
        margin: 24px auto;
      }

      section {
        padding: 16px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>代码审查 Agent</h1>
      <p>输入审查要求，Agent 会读取工作区代码并生成报告。</p>
    </header>

    <section>
      <h2>审查要求</h2>
      <form id="review-form">
        <label for="request">文件路径请使用相对于工作区的路径</label>
        <textarea id="request" maxlength="4000">请审查 examples/buggy_calculator.py，重点检查安全风险、异常处理和边界情况。</textarea>
        <p class="hint">可以按 Ctrl + Enter 开始审查。</p>
        <div class="actions">
          <button id="submit-button" type="submit">开始审查</button>
          <button id="reset-button" class="secondary" type="button">清空记忆</button>
        </div>
      </form>
    </section>

    <section>
      <div class="result-heading">
        <h2>审查结果</h2>
        <span id="run-state">未开始</span>
      </div>
      <div id="tool-steps" aria-label="工具调用记录"></div>
      <pre id="report">审查完成后，报告会显示在这里。</pre>
    </section>

    <footer>干宸骅 · 2412190733 · 计科2403</footer>
  </main>

  <script>
    const form = document.querySelector('#review-form');
    const requestInput = document.querySelector('#request');
    const submitButton = document.querySelector('#submit-button');
    const resetButton = document.querySelector('#reset-button');
    const report = document.querySelector('#report');
    const runState = document.querySelector('#run-state');
    const toolSteps = document.querySelector('#tool-steps');

    function setBusy(busy) {
      submitButton.disabled = busy;
      resetButton.disabled = busy;
      if (busy) runState.textContent = '正在分析…';
    }

    function showError(message) {
      report.textContent = `错误：${message}`;
      report.classList.add('error');
      runState.textContent = '执行失败';
      toolSteps.replaceChildren();
    }

    function showTools(steps) {
      toolSteps.replaceChildren();
      if (!steps.length) return;

      const label = document.createElement('span');
      label.textContent = '工具调用：';
      toolSteps.appendChild(label);

      for (const step of steps) {
        const item = document.createElement('span');
        item.className = 'tool-chip';
        item.textContent = step;
        toolSteps.appendChild(item);
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const request = requestInput.value.trim();
      if (!request) {
        showError('审查要求不能为空。');
        return;
      }

      report.classList.remove('error');
      report.textContent = '正在调用 Agent，请稍候…';
      toolSteps.replaceChildren();
      setBusy(true);

      try {
        const response = await fetch('/api/review', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({request}),
        });
        const data = await response.json();
        if (!response.ok || !data.ok) throw new Error(data.error || '请求失败');
        report.textContent = data.report;
        showTools(data.tool_steps || []);
        runState.textContent = '已完成';
      } catch (error) {
        showError(error.message || String(error));
      } finally {
        submitButton.disabled = false;
        resetButton.disabled = false;
      }
    });

    resetButton.addEventListener('click', async () => {
      resetButton.disabled = true;
      try {
        const response = await fetch('/api/reset', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: '{}',
        });
        const data = await response.json();
        if (!response.ok || !data.ok) throw new Error(data.error || '清空失败');
        report.classList.remove('error');
        report.textContent = data.message;
        runState.textContent = '记忆已清空';
        toolSteps.replaceChildren();
      } catch (error) {
        showError(error.message || String(error));
      } finally {
        resetButton.disabled = false;
      }
    });

    requestInput.addEventListener('keydown', (event) => {
      if (event.ctrlKey && event.key === 'Enter') form.requestSubmit();
    });
  </script>
</body>
</html>

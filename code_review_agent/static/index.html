<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>代码审查 Agent</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07111f;
      --panel: #101c2c;
      --panel-2: #16263a;
      --border: #28435f;
      --text: #eef6ff;
      --muted: #9db0c7;
      --cyan: #32d6c6;
      --blue: #5ea1ff;
      --green: #56d78b;
      --red: #ff6b78;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 85% 10%, rgba(50, 214, 198, .12), transparent 32rem),
        linear-gradient(160deg, #06101d 0%, #0b1a2d 100%);
      color: var(--text);
      font-family: "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    }

    .top-line { height: 6px; background: var(--cyan); }

    main {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 34px 0 56px;
    }

    header {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: flex-start;
      margin-bottom: 28px;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--cyan);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1 { margin: 0; font-size: clamp(34px, 5vw, 56px); line-height: 1.1; }

    .subtitle { margin: 14px 0 0; color: var(--muted); font-size: 17px; }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(16, 28, 44, .82);
      color: var(--muted);
      white-space: nowrap;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 14px rgba(86, 215, 139, .8);
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(280px, 390px) minmax(0, 1fr);
      gap: 22px;
      align-items: start;
    }

    .card {
      border: 1px solid var(--border);
      border-radius: 22px;
      background: rgba(16, 28, 44, .92);
      box-shadow: 0 22px 70px rgba(0, 0, 0, .22);
      overflow: hidden;
    }

    .card-head {
      padding: 20px 22px;
      background: var(--panel-2);
      border-bottom: 1px solid var(--border);
    }

    .card-head h2 { margin: 0; font-size: 19px; }
    .card-body { padding: 22px; }

    label { display: block; margin-bottom: 10px; color: var(--muted); font-size: 14px; }

    textarea {
      display: block;
      width: 100%;
      min-height: 205px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 15px;
      background: #091626;
      color: var(--text);
      font: inherit;
      line-height: 1.65;
      outline: none;
    }

    textarea:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(50, 214, 198, .12); }

    .hint { margin: 10px 0 18px; color: var(--muted); font-size: 13px; }

    .actions { display: flex; flex-wrap: wrap; gap: 10px; }

    button {
      border: 0;
      border-radius: 12px;
      padding: 11px 16px;
      color: #06101d;
      background: var(--cyan);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button.secondary { color: var(--text); background: #203751; }
    button:hover:not(:disabled) { filter: brightness(1.09); transform: translateY(-1px); }
    button:disabled { cursor: wait; opacity: .55; }

    .result-card { min-height: 520px; }

    .result-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    #run-state { color: var(--muted); font-size: 14px; }

    #tool-steps { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 16px; }

    .tool-chip {
      padding: 5px 9px;
      border-radius: 999px;
      background: rgba(94, 161, 255, .13);
      color: var(--blue);
      border: 1px solid rgba(94, 161, 255, .3);
      font: 13px ui-monospace, Consolas, monospace;
    }

    pre {
      min-height: 390px;
      margin: 0;
      padding: 18px;
      overflow: auto;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #091626;
      color: #dfeaff;
      font: 14px/1.7 ui-monospace, "Cascadia Mono", Consolas, monospace;
    }

    .error { color: var(--red); }

    footer { margin-top: 22px; color: var(--muted); font-size: 13px; text-align: center; }

    @media (max-width: 820px) {
      header { flex-direction: column; }
      .layout { grid-template-columns: 1fr; }
      .result-card { min-height: auto; }
    }
  </style>
</head>
<body>
  <div class="top-line"></div>
  <main>
    <header>
      <div>
        <p class="eyebrow">Software Engineering · Homework 1</p>
        <h1>代码审查 Agent</h1>
        <p class="subtitle">DeepSeek 根据任务自主读取、搜索代码并生成结构化审查报告</p>
      </div>
      <div class="status"><span class="status-dot"></span><span>本地服务已连接</span></div>
    </header>

    <section class="layout">
      <article class="card">
        <div class="card-head"><h2>审查要求</h2></div>
        <div class="card-body">
          <form id="review-form">
            <label for="request">所有文件路径均相对于启动时指定的工作区</label>
            <textarea id="request" maxlength="4000">请审查 examples/buggy_calculator.py，重点检查安全风险、异常处理和边界情况。</textarea>
            <p class="hint">按 Ctrl + Enter 也可以开始审查。API Key 不会发送到浏览器。</p>
            <div class="actions">
              <button id="submit-button" type="submit">开始审查</button>
              <button id="reset-button" class="secondary" type="button">清空记忆</button>
            </div>
          </form>
        </div>
      </article>

      <article class="card result-card">
        <div class="card-head result-meta">
          <h2>审查报告</h2>
          <span id="run-state">等待任务</span>
        </div>
        <div class="card-body">
          <div id="tool-steps" aria-label="工具调用记录"></div>
          <pre id="report">在左侧输入审查要求，然后点击“开始审查”。</pre>
        </div>
      </article>
    </section>

    <footer>干宸骅 · 2412190733 · 计科2403 · 本服务默认仅监听本机</footer>
  </main>

  <script>
    const form = document.querySelector('#review-form');
    const requestInput = document.querySelector('#request');
    const submitButton = document.querySelector('#submit-button');
    const resetButton = document.querySelector('#reset-button');
    const report = document.querySelector('#report');
    const runState = document.querySelector('#run-state');
    const toolSteps = document.querySelector('#tool-steps');

    function setBusy(busy) {
      submitButton.disabled = busy;
      resetButton.disabled = busy;
      if (busy) runState.textContent = 'DeepSeek 正在分析…';
    }

    function showError(message) {
      report.textContent = `错误：${message}`;
      report.classList.add('error');
      runState.textContent = '执行失败';
      toolSteps.replaceChildren();
    }

    function showTools(steps) {
      toolSteps.replaceChildren();
      for (const step of steps) {
        const chip = document.createElement('span');
        chip.className = 'tool-chip';
        chip.textContent = step;
        toolSteps.appendChild(chip);
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const request = requestInput.value.trim();
      if (!request) {
        showError('审查要求不能为空。');
        return;
      }
      report.classList.remove('error');
      report.textContent = '正在调用 Agent，请稍候…';
      toolSteps.replaceChildren();
      setBusy(true);
      try {
        const response = await fetch('/api/review', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({request}),
        });
        const data = await response.json();
        if (!response.ok || !data.ok) throw new Error(data.error || '请求失败');
        report.textContent = data.report;
        showTools(data.tool_steps || []);
        runState.textContent = '任务完成';
      } catch (error) {
        showError(error.message || String(error));
      } finally {
        submitButton.disabled = false;
        resetButton.disabled = false;
      }
    });

    resetButton.addEventListener('click', async () => {
      resetButton.disabled = true;
      try {
        const response = await fetch('/api/reset', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: '{}',
        });
        const data = await response.json();
        if (!response.ok || !data.ok) throw new Error(data.error || '清空失败');
        report.classList.remove('error');
        report.textContent = data.message;
        runState.textContent = '记忆已清空';
        toolSteps.replaceChildren();
      } catch (error) {
        showError(error.message || String(error));
      } finally {
        resetButton.disabled = false;
      }
    });

    requestInput.addEventListener('keydown', (event) => {
      if (event.ctrlKey && event.key === 'Enter') form.requestSubmit();
    });
  </script>
</body>
</html>

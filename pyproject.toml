[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-review-agent"
version = "0.2.0"
description = "A small tool-using code review agent for Software Engineering Homework 1"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
code-review-agent = "code_review_agent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["code_review_agent*"]

[tool.setuptools.package-data]
code_review_agent = ["static/*.html"]
